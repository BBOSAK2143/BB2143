<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 240px;
    padding: 16px;
    margin: 0;
    font-family: system-ui, sans-serif;
    background: linear-gradient(to bottom, #001e1e 0%, #005151 60%, #001e1e 100%);
    color: #00d200;
    border: 2px solid #840000;
  }
  h3 { margin: 0 0 8px 0; color: #0cffff; font-size: 15px; }
  p { margin: 0 0 14px 0; font-size: 12px; color: #00b200; }
  button {
    width: 100%;
    padding: 10px;
    font-weight: bold;
    border-radius: 6px;
    border: 1px solid #840000;
    background: #002727;
    color: #df7000;
    cursor: pointer;
  }
  button.on {
    border-color: #00e3e3;
    color: #0cffff;
  }
</style>
</head>
<body>
  <h3>BBOSAK2143 Eye-Saver</h3>
  <p id="status">Status: Active</p>
  <button id="toggle">Turn Off</button>
  <script src="popup.js"></script>
</body>
</html>
